name: Verify P0 lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-p0-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - run: npx eslint src/main.tsx src/components/MobileConversionShell.tsx src/components/FormAnalyticsObserver.tsx src/components/QuickContactButton.tsx
