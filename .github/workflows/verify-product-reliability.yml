name: Verify product reliability

on:
  pull_request:
    paths:
      - 'src/features/**'
      - 'src/hooks/useInvoiceTransactions.ts'
      - 'src/lib/invoice-lines.ts'
      - 'src/pages/admin/AdminDashboard.tsx'
      - 'src/pages/admin/AdminNewInvoice.tsx'
      - 'supabase/functions/public-booking/**'
      - 'supabase/migrations/2026062522*.sql'
      - '.github/workflows/verify-product-reliability.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint changed production files
        run: >-
          npx eslint
          src/features/dashboard/AdminDashboardPage.tsx
          src/features/invoicing/InvoiceLineEditor.tsx
          src/features/invoicing/NewInvoicePage.tsx
          src/features/routes/route-order.ts
          src/hooks/useInvoiceTransactions.ts
          src/lib/invoice-lines.ts
          src/pages/admin/AdminDashboard.tsx
          src/pages/admin/AdminNewInvoice.tsx
      - run: npm run build
      - run: npm test
