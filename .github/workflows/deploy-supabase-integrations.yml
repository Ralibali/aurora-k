name: Deploy Supabase integrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase-integrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-integrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: dqjwtnziasqtveuwnalx
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Deployment blocked: configure SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD or deploy through Lovable Cloud."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link Supabase project
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending migrations
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes supabase@latest db push --linked --yes

      - name: Deploy all Edge Functions
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          function_count=0
          # Discover directories so new functions cannot be omitted from a manual list.
          for function_dir in supabase/functions/*/; do
            function_name="${function_dir%/}"
            function_name="${function_name##*/}"
            [[ "$function_name" == _* ]] && continue
            # Supabase reads verify_jwt from config.toml (default: true).
            npx --yes supabase@latest functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --use-api
            function_count=$((function_count + 1))
          done
          if (( function_count == 0 )); then
            echo "::error::No Edge Function directories found."
            exit 1
          fi
