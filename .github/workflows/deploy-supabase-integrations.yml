name: Deploy Supabase integrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase-integrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-integrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: dqjwtnziasqtveuwnalx
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Configure SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link Supabase project
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending migrations
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes supabase@latest db push --linked --yes

      - name: Deploy authenticated functions
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          for function_name in \
            parse-order-document \
            order-inbox-api \
            fortnox-oauth-start \
            fortnox-api \
            driver-sync \
            send-email \
            register-company \
            create-checkout \
            stripe-portal \
            demo-login
          do
            npx --yes supabase@latest functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done

      - name: Deploy verified public callbacks
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          for function_name in \
            resend-inbound-order \
            fortnox-oauth-callback \
            stripe-webhook \
            track-assignment \
            customer-portal \
            public-booking \
            notify-admin
          do
            npx --yes supabase@latest functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          done
