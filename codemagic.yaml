workflows:
  ios-release:
    name: Aurora Transport iOS TestFlight
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: se.auroramedia.auroratransport
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install and verify
        script: npm ci && npm run typecheck && npm test && npm run test:driver-db
      - name: Prepare driver app
        script: npm run build:native && node scripts/native-prepare.mjs ios
      - name: Generate icons
        script: npx --no-install capacitor-assets generate --ios
      - name: Version
        script: |
          export BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 1))
          node scripts/native-version.mjs
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-release:
    name: Aurora Transport Google Play Internal
    max_build_duration: 60
    environment:
      android_signing:
        - aurora_keystore
      node: 22
      java: 21
      groups:
        - google_play
      vars:
        PACKAGE_NAME: se.auroramedia.auroratransport
    scripts:
      - name: Install and verify
        script: npm ci && npm run typecheck && npm test && npm run test:driver-db
      - name: Check Firebase configuration
        script: test -n "$GOOGLE_SERVICES_JSON"
      - name: Prepare driver app
        script: npm run build:native && node scripts/native-prepare.mjs android
      - name: Generate icons
        script: npx --no-install capacitor-assets generate --android
      - name: Version
        script: |
          export BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + 1))
          node scripts/native-version.mjs
      - name: Build signed AAB
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
