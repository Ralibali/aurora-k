workflows:
  ios-release:
    name: Aurora Transport iOS Release
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: se.auroramedia.auroratransport
      node: 22
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install deps
        script: npm ci
      - name: Build web
        script: npm run build
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Patch iOS project (Info.plist-behörigheter)
        script: node scripts/ios-post-add.mjs
      - name: Generate app icons & splash
        script: npx --yes @capacitor/assets generate --ios
      - name: Bump build number
        script: |
          cd ios/App
          agvtool next-version -all
          cd ../..
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-release:
    name: Aurora Transport Android Release
    max_build_duration: 60
    environment:
      android_signing:
        - aurora_keystore
      node: 22
      java: 17
      groups:
        - google_play
      vars:
        PACKAGE_NAME: se.auroramedia.auroratransport
    scripts:
      - name: Install deps
        script: |
          npm ci
          npm install --no-save @capacitor/android@8.3.0
      - name: Build web
        script: npm run build
      - name: Add Android platform if missing
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Generate app icons & splash
        script: npx --yes @capacitor/assets generate --android
      - name: Patch AndroidManifest (permissions, FCM)
        script: node scripts/android-post-add.mjs
      - name: Capacitor sync
        script: npx cap sync android
      - name: Set version code
        script: |
          cd android
          VERSION_CODE=$(($(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks=internal 2>/dev/null || echo 0) + 1))
          sed -i.bak "s/versionCode .*/versionCode $VERSION_CODE/" app/build.gradle
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease \
            -PMYAPP_UPLOAD_STORE_FILE="$CM_KEYSTORE_PATH" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$CM_KEY_ALIAS" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$CM_KEYSTORE_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
